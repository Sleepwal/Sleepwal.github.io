baseURL = 'https://sleepwal.github.io/'
languageCode = 'en-us'
title = 'SleepWalker Blog'
theme = 'hugo-theme-stack'

[params]
  mainSections = ["post"]

[params.sidebar]
  emoji = "🚀"
  subtitle = "代码与咖啡，还有诗和远方"

[params.article]
  toc = true
  readingTime = true

[params.widgets]
  homepage = [
    { type = "search" },
    { type = "archives", params = { limit = 5 } },
    { type = "categories", params = { limit = 10 } },
    { type = "tag-cloud", params = { limit = 10 } },
  ]
  page = [{ type = "toc" }]
